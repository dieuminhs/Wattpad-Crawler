[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wattpad-crawler"
version = "0.1.0"
description = "Archive Wattpad stories locally before they're removed"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "ebooklib>=0.18",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-vcr>=1.0.2",
  "vcrpy>=6.0",
  "ruff>=0.5",
]

[project.scripts]
wattpad-crawler = "wattpad_crawler.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits live Wattpad API; skipped by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["wattpad_crawler"]
