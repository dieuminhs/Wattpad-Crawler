[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-story-archive"
version = "0.2.2"
description = "Archive Wattpad stories locally before they're removed"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "ebooklib>=0.18",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "sse-starlette>=2.0",
  "nh3>=0.3,<0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-vcr>=1.0.2",
  "vcrpy>=6.0",
  "ruff>=0.5",
]
desktop = [
  "pyinstaller>=6.0",
]

[project.scripts]
local-story-archive = "local_story_archive.cli:main"
local-story-archive-desktop-backend = "local_story_archive.desktop:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits live Wattpad API; skipped by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["local_story_archive"]

[tool.hatch.build.targets.wheel]
packages = ["local_story_archive"]

[tool.hatch.build.targets.wheel.force-include]
"local_story_archive/web/templates" = "local_story_archive/web/templates"
"local_story_archive/web/static" = "local_story_archive/web/static"



