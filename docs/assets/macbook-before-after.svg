<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Local Story Archive MacBook local setup before and after</title>
  <desc id="desc">A before-and-after diagram showing Wattpad stories archived from the web into a local MacBook folder with EPUB, HTML, TXT, cover images, metadata, comments, and reader files.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed" />
      <stop offset="1" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1200" height="630" rx="32" fill="url(#bg)" />
  <circle cx="1090" cy="76" r="112" fill="#fb923c" opacity="0.16" />
  <circle cx="114" cy="568" r="132" fill="#38bdf8" opacity="0.14" />

  <text x="600" y="72" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="800" fill="#111827">Local Story Archive: local MacBook archive</text>
  <text x="600" y="112" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#475569">Save stories before they disappear. Read them later from your own files.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="165" width="460" height="330" rx="28" fill="#ffffff" />
    <rect x="670" y="165" width="460" height="330" rx="28" fill="#ffffff" />
  </g>

  <text x="300" y="215" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#ef4444">Before</text>
  <text x="900" y="215" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#16a34a">After</text>

  <g transform="translate(130 250)">
    <rect x="0" y="0" width="340" height="190" rx="18" fill="url(#screen)" />
    <rect x="22" y="24" width="296" height="30" rx="15" fill="#334155" />
    <circle cx="44" cy="39" r="6" fill="#ef4444" />
    <circle cx="66" cy="39" r="6" fill="#f59e0b" />
    <circle cx="88" cy="39" r="6" fill="#22c55e" />
    <rect x="44" y="82" width="252" height="18" rx="9" fill="#fb923c" />
    <rect x="44" y="116" width="198" height="14" rx="7" fill="#94a3b8" />
    <rect x="44" y="146" width="230" height="14" rx="7" fill="#64748b" />
    <path d="M38 210h264l32 32H6z" fill="#cbd5e1" />
    <rect x="120" y="220" width="100" height="8" rx="4" fill="#94a3b8" />
    <text x="170" y="285" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#334155">Stories only online</text>
    <text x="170" y="315" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#64748b">Risk: removals, expired links, lost comments</text>
  </g>

  <g transform="translate(552 310)">
    <path d="M0 0h84" stroke="#fb923c" stroke-width="10" stroke-linecap="round" />
    <path d="M58 -24l38 24-38 24" fill="none" stroke="#fb923c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <text x="42" y="55" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#9a3412">archive</text>
  </g>

  <g transform="translate(730 247)">
    <rect x="0" y="0" width="340" height="214" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" />
    <rect x="26" y="30" width="118" height="154" rx="12" fill="#fed7aa" />
    <rect x="46" y="52" width="78" height="100" rx="8" fill="#fb923c" />
    <rect x="166" y="34" width="132" height="20" rx="10" fill="#0f172a" />
    <rect x="166" y="72" width="118" height="14" rx="7" fill="#64748b" />
    <rect x="166" y="102" width="138" height="14" rx="7" fill="#64748b" />
    <rect x="166" y="132" width="92" height="14" rx="7" fill="#64748b" />
    <rect x="166" y="164" width="62" height="28" rx="14" fill="#16a34a" />
    <rect x="238" y="164" width="62" height="28" rx="14" fill="#2563eb" />
    <text x="197" y="184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">EPUB</text>
    <text x="253" y="184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">HTML</text>
    <text x="170" y="265" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#334155">Local `wattpad-archive/` folder</text>
    <text x="170" y="295" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#64748b">Chapters, images, metadata, comments, reader files</text>
  </g>

  <g transform="translate(120 535)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#334155">
    <rect x="0" y="0" width="960" height="52" rx="26" fill="#ffffff" opacity="0.86" />
    <text x="32" y="34" font-weight="800" fill="#0f172a">Quick start:</text>
    <text x="150" y="34">install → add cookie → run `local-story-archive serve` → open `http://127.0.0.1:8000`</text>
  </g>
</svg>
