<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">local Wattpad archive folder contents</title>
  <desc id="desc">Diagram showing the wattpad-archive folder containing settings, progress database, story folders, covers, chapters, comments, EPUB, HTML, and TXT output files.</desc>
  <rect width="1200" height="520" rx="32" fill="#fff7ed" />
  <text x="600" y="68" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" fill="#0f172a">What gets saved on your Mac</text>
  <text x="600" y="104" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#64748b">Back up the whole `wattpad-archive` folder so comments and progress stay with the stories.</text>

  <g transform="translate(90 148)">
    <path d="M22 0h260l46 46h700c18 0 32 14 32 32v250c0 18-14 32-32 32H22c-18 0-32-14-32-32V32C-10 14 4 0 22 0z" fill="#fbbf24" />
    <path d="M22 52h1006c18 0 32 14 32 32v244c0 18-14 32-32 32H22c-18 0-32-14-32-32V84c0-18 14-32 32-32z" fill="#fde68a" />
    <text x="44" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="900" fill="#713f12">wattpad-archive/</text>

    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#334155">
      <g transform="translate(58 132)">
        <rect width="285" height="64" rx="16" fill="#ffffff" opacity="0.88" />
        <text x="24" y="28" font-weight="800" fill="#0f172a">Settings</text>
        <text x="24" y="52" font-size="15" fill="#64748b">_config.toml, cookie, speed</text>
      </g>
      <g transform="translate(384 132)">
        <rect width="285" height="64" rx="16" fill="#ffffff" opacity="0.88" />
        <text x="24" y="28" font-weight="800" fill="#0f172a">Progress</text>
        <text x="24" y="52" font-size="15" fill="#64748b">_state.sqlite remembers work</text>
      </g>
      <g transform="translate(710 132)">
        <rect width="285" height="64" rx="16" fill="#ffffff" opacity="0.88" />
        <text x="24" y="28" font-weight="800" fill="#0f172a">Story folders</text>
        <text x="24" y="52" font-size="15" fill="#64748b">stories/author/title/</text>
      </g>
      <g transform="translate(58 226)">
        <rect width="285" height="64" rx="16" fill="#ffffff" opacity="0.88" />
        <text x="24" y="28" font-weight="800" fill="#0f172a">Original data</text>
        <text x="24" y="52" font-size="15" fill="#64748b">metadata, covers, chapters</text>
      </g>
      <g transform="translate(384 226)">
        <rect width="285" height="64" rx="16" fill="#ffffff" opacity="0.88" />
        <text x="24" y="28" font-weight="800" fill="#0f172a">Comments</text>
        <text x="24" y="52" font-size="15" fill="#64748b">inline and chapter comments</text>
      </g>
      <g transform="translate(710 226)">
        <rect width="285" height="64" rx="16" fill="#ffffff" opacity="0.88" />
        <text x="24" y="28" font-weight="800" fill="#0f172a">Reading files</text>
        <text x="24" y="52" font-size="15" fill="#64748b">EPUB, HTML, TXT output</text>
      </g>
    </g>
  </g>
</svg>
