name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

jobs:
  test:
    name: Run Python tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev,desktop]"

      - name: Run unit tests
        run: python -m pytest tests/unit

  build:
    needs: test
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact_name: local-story-archive-windows
            artifact_paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*setup.exe
          - name: macOS Apple Silicon
            os: macos-14
            artifact_name: local-story-archive-macos-aarch64
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          - name: macOS Intel
            os: macos-13
            artifact_name: local-story-archive-macos-x64
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev,desktop]"

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare macOS icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p src-tauri/icons/icon.iconset
          sips -z 16 16 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_16x16.png
          sips -z 32 32 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_16x16@2x.png
          sips -z 32 32 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_32x32.png
          sips -z 64 64 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_128x128.png
          sips -z 256 256 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_128x128@2x.png
          sips -z 256 256 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_256x256.png
          sips -z 512 512 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_256x256@2x.png
          sips -z 512 512 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_512x512.png
          cp src-tauri/icons/icon.png src-tauri/icons/icon.iconset/icon_512x512@2x.png
          iconutil -c icns src-tauri/icons/icon.iconset -o src-tauri/icons/icon.icns
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("src-tauri/tauri.conf.json")
          data = json.loads(path.read_text())
          data["bundle"]["icon"] = ["icons/icon.icns"]
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Build desktop app
        shell: bash
        env:
          MACOS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          MACOS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_APPLE_ID: ${{ secrets.APPLE_ID }}
          MACOS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          MACOS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +e
          if [ "${{ runner.os }}" = "macOS" ]; then
            if [ -n "$MACOS_APPLE_CERTIFICATE" ] && [ -n "$MACOS_APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$MACOS_APPLE_SIGNING_IDENTITY" ]; then
              export APPLE_CERTIFICATE="$MACOS_APPLE_CERTIFICATE"
              export APPLE_CERTIFICATE_PASSWORD="$MACOS_APPLE_CERTIFICATE_PASSWORD"
              export APPLE_SIGNING_IDENTITY="$MACOS_APPLE_SIGNING_IDENTITY"
              echo "macOS code signing is configured."
            else
              echo "::warning::macOS signing secrets are incomplete; building an unsigned app."
            fi

            if [ -n "$MACOS_APPLE_ID" ] && [ -n "$MACOS_APPLE_PASSWORD" ] && [ -n "$MACOS_APPLE_TEAM_ID" ]; then
              export APPLE_ID="$MACOS_APPLE_ID"
              export APPLE_PASSWORD="$MACOS_APPLE_PASSWORD"
              export APPLE_TEAM_ID="$MACOS_APPLE_TEAM_ID"
              echo "macOS notarization is configured."
            else
              echo "::warning::macOS notarization secrets are incomplete; downloaded DMGs may be blocked by Gatekeeper."
            fi
          fi
          npm run desktop:build
          status=$?
          if [ "$status" -ne 0 ] && [ "${{ runner.os }}" = "macOS" ]; then
            echo "::group::macOS DMG diagnostics"
            find src-tauri/target/release/bundle -maxdepth 3 -print || true
            if [ -f src-tauri/target/release/bundle/dmg/bundle_dmg.sh ]; then
              echo "--- bundle_dmg.sh ---"
              sed -n '1,240p' src-tauri/target/release/bundle/dmg/bundle_dmg.sh
              echo "--- rerun bundle_dmg.sh with bash -x ---"
              (cd src-tauri/target/release/bundle/dmg && bash -x ./bundle_dmg.sh) || true
            fi
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14
