name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

jobs:
  test:
    name: Run Python tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev,desktop]"

      - name: Run unit tests
        run: python -m pytest tests/unit

  build:
    needs: test
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact_name: local-story-archive-windows
            artifact_paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*setup.exe
          - name: macOS Apple Silicon
            os: macos-14
            artifact_name: local-story-archive-macos-aarch64
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - name: macOS Intel
            os: macos-13
            artifact_name: local-story-archive-macos-x64
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev,desktop]"

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare macOS icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p src-tauri/icons/icon.iconset
          sips -z 16 16 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_16x16.png
          sips -z 32 32 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_16x16@2x.png
          sips -z 32 32 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_32x32.png
          sips -z 64 64 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_128x128.png
          sips -z 256 256 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_128x128@2x.png
          sips -z 256 256 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_256x256.png
          sips -z 512 512 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_256x256@2x.png
          sips -z 512 512 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_512x512.png
          cp src-tauri/icons/icon.png src-tauri/icons/icon.iconset/icon_512x512@2x.png
          iconutil -c icns src-tauri/icons/icon.iconset -o src-tauri/icons/icon.icns
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("src-tauri/tauri.conf.json")
          data = json.loads(path.read_text())
          data["bundle"]["icon"] = ["icons/icon.icns"]
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Prepare macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::warning::macOS signing secret $name is missing."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
              echo "::error::Tagged macOS releases must be signed and notarized. Add the Apple signing secrets and rerun."
              exit 1
            fi
            echo "Skipping macOS signing setup for this non-release build."
            exit 0
          fi

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/local-story-archive-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | sed 's/[\" ]//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"

          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            APPLE_SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)"
          fi
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::error::Could not find a Developer ID Application signing identity in the imported certificate."
            exit 1
          fi

          add_env() {
            local name="$1"
            local value="$2"
            local delimiter="EOF_${name}_$(openssl rand -hex 8)"
            {
              echo "$name<<$delimiter"
              echo "$value"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          }
          add_env APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          add_env APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          add_env APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          add_env APPLE_ID "$APPLE_ID"
          add_env APPLE_PASSWORD "$APPLE_PASSWORD"
          add_env APPLE_TEAM_ID "$APPLE_TEAM_ID"
          echo "macOS signing identity: $APPLE_SIGNING_IDENTITY"

      - name: Build desktop app
        shell: bash
        run: |
          set +e
          if [ "${{ runner.os }}" = "macOS" ]; then
            if [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
              echo "macOS code signing is configured."
            else
              echo "::warning::macOS signing secrets are incomplete; building an unsigned app."
            fi

            if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
              echo "macOS notarization is configured."
            else
              echo "::warning::macOS notarization secrets are incomplete; downloaded DMGs may be blocked by Gatekeeper."
            fi
          fi
          npm run desktop:build
          status=$?
          if [ "$status" -ne 0 ] && [ "${{ runner.os }}" = "macOS" ]; then
            echo "::group::macOS DMG diagnostics"
            find src-tauri/target/release/bundle -maxdepth 3 -print || true
            if [ -f src-tauri/target/release/bundle/dmg/bundle_dmg.sh ]; then
              echo "--- bundle_dmg.sh ---"
              sed -n '1,240p' src-tauri/target/release/bundle/dmg/bundle_dmg.sh
              echo "--- rerun bundle_dmg.sh with bash -x ---"
              (cd src-tauri/target/release/bundle/dmg && bash -x ./bundle_dmg.sh) || true
            fi
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14
